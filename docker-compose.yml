# Usage:
#   docker compose up -d --build                      # database, schema, backend, dashboard
#   docker compose run --rm scraper                   # collect data (all regulators)
#   docker compose run --rm scraper python generic_scraper.py --only CCI --dry-run
# Dashboard: http://localhost:8080   API: http://localhost:8000/docs

x-db-env: &db-env
  DATABASE_URL: postgresql://reghub:${POSTGRES_PASSWORD:-reghub}@db:5432/reghub

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reghub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reghub}
      POSTGRES_DB: reghub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reghub -d reghub"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database/schema.sql on every `up`; the schema is safe to re-run.
  migrate:
    build: { context: ., dockerfile: docker/python.Dockerfile }
    image: reghub-python
    environment: *db-env
    command: ["sh", "-c", "psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /app/database/schema.sql"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  backend:
    image: reghub-python
    environment:
      <<: *db-env
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - models:/models
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # On-demand only (profile keeps it out of `docker compose up`).
  scraper:
    image: reghub-python
    profiles: ["scrape"]
    working_dir: /app/scrapers
    environment:
      <<: *db-env
      MAX_PAGES: ${MAX_PAGES:-3}
    volumes:
      - models:/models
      - scraper-models:/app/scrapers/models
    command: ["sh", "-c", "python rbi_sebi_scraper.py && python generic_scraper.py"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  models:
  scraper-models:
